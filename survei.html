<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survei Kepuasan Mahasiswa</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        header, footer {
            background-color: #0077cc;
            color: white;
            text-align: center;
            padding: 15px;
        }

        main {
            width: 70%;
            margin: 20px auto;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        fieldset {
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 8px;
        }

        legend {
            font-weight: bold;
        }

        label {
            display: block;
            margin-top: 10px;
            margin-bottom: 5px;
        }

        input, select, textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }

        .radio-group input {
            width: auto;
        }

        .radio-group label {
            display: inline;
            margin-right: 15px;
        }

        .checkbox {
            width: auto;
        }

        button {
            background-color: #0077cc;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background-color: #005fa3;
        }
    </style>
</head>
<body>

<header>
    <h1>Survei Kepuasan Mahasiswa</h1>
</header>

<main>

<form action="#" method="post">

    <!-- Fieldset 1 -->
    <fieldset>
        <legend>Data Mahasiswa</legend>

        <label for="nama">Nama:</label>
        <input type="text" id="nama" name="nama" required>

        <label for="nim">NIM:</label>
        <input type="number" id="nim" name="nim" required minlength="8">

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="fakultas">Fakultas:</label>
        <select id="fakultas" name="fakultas" required>
            <option value="">-- Pilih Fakultas --</option>
            <option value="FT">Fakultas Teknik</option>
            <option value="FEB">Fakultas Ekonomi dan Bisnis</option>
            <option value="FH">Fakultas Hukum</option>
            <option value="FISIP">Fakultas Ilmu Sosial dan Politik</option>
            <option value="FKIP">Fakultas Keguruan dan Ilmu Pendidikan</option>
        </select>

        <label for="semester">Semester Saat Ini:</label>
        <input type="number" id="semester" name="semester" min="1" max="8">
    </fieldset>

    <!-- Fieldset 2 -->
    <fieldset>
        <legend>Penilaian Layanan Kampus</legend>

        <label>Tingkat Kepuasan:</label>

        <div class="radio-group">
            <input type="radio" id="nilai1" name="kepuasan" value="1" required>
            <label for="nilai1">1</label>

            <input type="radio" id="nilai2" name="kepuasan" value="2">
            <label for="nilai2">2</label>

            <input type="radio" id="nilai3" name="kepuasan" value="3">
            <label for="nilai3">3</label>

            <input type="radio" id="nilai4" name="kepuasan" value="4">
            <label for="nilai4">4</label>

            <input type="radio" id="nilai5" name="kepuasan" value="5">
            <label for="nilai5">5</label>
        </div>

        <label for="saran">Saran/Keluhan:</label>
        <textarea id="saran" name="saran" rows="5"
            placeholder="Contoh: Pelayanan administrasi perlu dipercepat."></textarea>

        <br><br>

        <input type="checkbox" id="setuju" name="setuju" class="checkbox">
        <label for="setuju" style="display:inline;">
            Saya bersedia dihubungi untuk tindak lanjut survei.
        </label>

    </fieldset>

    <button type="submit">Kirim Survei</button>
    <button type="reset">Reset</button>

</form>

</main>
</footer>
